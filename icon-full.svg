<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed version of icon.svg for iOS home screens and Android "maskable" icons:
       no rounded corners (the OS applies its own) and the capsule stays inside the safe zone. -->
  <rect width="512" height="512" fill="#273E47"/>
  <g transform="rotate(-40 256 256)">
    <clipPath id="c"><rect x="96" y="186" width="320" height="140" rx="70"/></clipPath>
    <g clip-path="url(#c)">
      <rect x="96" y="186" width="160" height="140" fill="#BD632F"/>
      <rect x="256" y="186" width="160" height="140" fill="#F3E9DC"/>
    </g>
    <rect x="96" y="186" width="320" height="140" rx="70" fill="none" stroke="#A1CDA8" stroke-width="14"/>
  </g>
</svg>
